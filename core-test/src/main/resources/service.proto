syntax = "proto3";
package service;

import "types.proto";

// Service that depends on types (multi-level dependency: service -> types -> common)
message CreateUserRequest {
    types.User user = 1;
}

message CreateUserResponse {
    types.User user = 1;
    bool success = 2;
}

message OrderRequest {
    types.User user = 1;
    repeated types.Product products = 2;
}
